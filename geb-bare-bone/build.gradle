//TODO Fix these dummy workarounds for Intellij
buildscript {
    repositories {
        mavenCentral()
        maven { url = "https://repository.apache.org/content/repositories/snapshots" }
    }
    dependencies {
        classpath 'org.apache.ivy:ivy:2.5.3'
        classpath 'org.apache.groovy:groovy-json:4.0.33'
    }
}

/**
 * Geb and Webdriver mgmt
 * Properties:
 *  qa.webdriver
 */

tasks.withType(Test).configureEach {
    systemProperty 'geb.env', project.findProperty('qa.webdriver')
    systemProperty 'geb.build.reportsDir', 'reports'
}

// This is a replacement for that deprecated Project.exec()
// See more: https://docs.gradle.org/current/userguide/service_injection.html#execoperations
abstract class RemoveWebdriverInstances extends DefaultTask {
    //@javax.inject.Inject
    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void removeInstances() {
        ['webdriver', 'chromedriver', 'marionette'].each { processName ->
            logger.lifecycle "Reporting on hanging instances of process: {}", processName
            execOperations.exec {
                ignoreExitValue = true
                commandLine 'pgrep', processName
            }
        }
        ['webdriver', 'chromedriver', 'marionette'].each { processName ->
            logger.lifecycle "Removing hanging instances of process: {}", processName
            execOperations.exec {
                ignoreExitValue = true
                commandLine 'pkill', '-f', processName
            }
        }
    }
}

tasks.register('removeWebdriverInstances', RemoveWebdriverInstances) {
    group = 'other'
    description = 'removes hanging instances of webdriver'
}

tasks.register('cleanGebTestResults', Delete) {
    group = 'other'
    description = 'removes geb reports and logs'
    delete "reports"
    delete "logs"
}

/**
 *  Usual configuration
 */

repositories {
    mavenCentral()
    maven { url = "https://repository.apache.org/content/repositories/snapshots" }
}

dependencies {
    def gebVersion = '8.0.1'
    implementation "org.apache.groovy.geb:geb-core:${gebVersion}"
    testImplementation "org.apache.groovy.geb:geb-spock:${gebVersion}"
    def webdriverVersion = '4.50.0'
    implementation 'io.netty:netty-buffer:4.1.117.Final' // TODO see below - workaround
    implementation("org.seleniumhq.selenium:selenium-support:${webdriverVersion}") {
        exclude group: 'io.netty'
    }
    implementation("org.seleniumhq.selenium:selenium-chrome-driver:${webdriverVersion}") {
        exclude group: 'io.netty'
    }
    implementation("org.seleniumhq.selenium:selenium-chromium-driver:${webdriverVersion}") {
        exclude group: 'io.netty'
    }
    implementation("org.seleniumhq.selenium:selenium-firefox-driver:${webdriverVersion}") {
        exclude group: 'io.netty'
    }
    implementation("org.seleniumhq.selenium:selenium-devtools-v154:${webdriverVersion}") {
        exclude group: 'io.netty'
    }

    testImplementation('com.athaydes:spock-reports:2.5.1-groovy-4.0') {
        transitive = false
    }

    // TODO check https://github.com/AOEpeople/geb-spock-reports
    testImplementation('com.aoe:geb-spock-reports:0.3.0-RC1') {
        exclude group: 'org.codehaus.groovy'
    }

    implementation('com.assertthat:selenium-shutterbug:1.6') {
        exclude group: 'org.seleniumhq.selenium'
        exclude group: 'org.codehaus.groovy'
    }

    def versionBrowserUp = '3.2.2'
    implementation "com.github.valfirst.browserup-proxy:browserup-proxy-core:${versionBrowserUp}"
    implementation "com.github.valfirst.browserup-proxy:browserup-proxy-mitm:${versionBrowserUp}"

    // Proxy https://github.com/LittleProxy/LittleProxy
    implementation 'io.github.littleproxy:littleproxy:2.4.6'

    // Decompressing Brotli-encoded payload
    implementation 'org.brotli:dec:0.1.2'

}